packages:
  - "packages/*"
  - "examples/*"

# esbuild ships a platform binary through its install script (tsup and vitest need it)
allowBuilds:
  esbuild: true
  # onnxruntime-node fetches the native runtime the local embedder runs on.
  onnxruntime-node: true
  # `transformers.node.mjs` imports sharp at the top level, so it is resolved
  # before any of our code runs even though nothing here touches an image. Its
  # install script falls back to building from source when no `@img/sharp-*`
  # prebuilt matches the platform; blocked, that fallback is gone and text
  # embedding dies at import on any machine the prebuilt missed.
  sharp: true
  # protobufjs only registers handlers for formats we never load.
  protobufjs: false
